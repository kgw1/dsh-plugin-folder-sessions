name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build + syntax check (regenerates client.js)
        run: npm run check
      - name: Committed client bundle is up to date
        run: git diff --exit-code -- client.js
      - name: Unit tests
        run: npm test
